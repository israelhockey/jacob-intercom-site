# One-off helper: copies product photos from Jacob's current site (jacobintercom.com) into the repo.
# Runs when tools/original-images.txt changes.
name: Fetch original site images
on:
  push:
    paths: ["tools/original-images.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p assets/img/orig
          while read -r name path; do
            [ -z "$name" ] && continue
            curl -fsSL --retry 3 -A "Mozilla/5.0" -o "assets/img/orig/$name" "https://jacobintercom.com/wp-content/uploads/$path" && echo "ok $name" || echo "FAILED $name"
          done < tools/original-images.txt
          ls -la assets/img/orig
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/img/orig
          git commit -m "Add product photos from jacobintercom.com" || echo "nothing to commit"
          git push
