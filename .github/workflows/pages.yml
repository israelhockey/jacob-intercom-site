name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Review phase: GitHub Pages sub-folder, hidden from search engines (out/staging).
      # At launch: set SITE_BASE to "/", publish out/site, and add the CNAME file for jacobintercom.com.
      - name: Build
        run: SITE_BASE=/jacob-intercom-site/ PUBLIC_URL=https://israelhockey.github.io/jacob-intercom-site python3 build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
